name: ZAP API scan
on:
  workflow_run:
    workflows: [Continuous Deployment]
    types:
      - completed
    branches: [main] # Only triggers from `main`
  workflow_dispatch:
jobs:
  zap_scan:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: ⚡️ Zap development
    permissions:
      id-token: write # Required for AWS OIDC
      contents: read
      security-events: write # Required for SARIF upload
      actions: read
    timeout-minutes: 15
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: "eu-west-2"
          role-session-name: ${{ github.run_id }}

      - name: Get AWS account ID
        id: aws-account
        run: |
          echo "account-id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT
        env:
          STAGE: "development"
        run: pnpm dastSetup

      - name: Verify authentication values
        run: |
          if [ -z "$ZAP_AUTH_HEADER_VALUE" ]; then
            echo "Failure: Auth header is missing!"
            exit 1
          fi
          echo "Success: Authentication values are available."

      - name: Generate OpenAPI specifications
        run: pnpm openapi:generate

      - name: Merge and validate public OpenAPI specifications for ZAP
        run: pnpm exec tsx scripts/zap/merge-openapi.ts

      - name: Verify API authentication
        shell: bash
        env:
          API_URL: ${{ secrets.DEVELOPMENT_API_URL }}
        run: bash scripts/zap/verify-auth.sh

      - name: Run ZAP API scan
        id: zap
        shell: bash
        env:
          API_URL: ${{ secrets.DEVELOPMENT_API_URL }}
        run: bash scripts/zap/run-scan.sh

      - name: Verify ZAP reports
        shell: bash
        run: bash scripts/zap/verify-reports.sh

      - name: Normalize ZAP SARIF for GitHub Code Scanning
        shell: bash
        run: bash scripts/zap/normalize-sarif.sh

      - name: Generate ZAP finding fingerprints
        id: zap_fingerprints
        shell: bash
        run: bash scripts/zap/generate-fingerprints.sh

      - name: Load previous ZAP finding baseline
        id: zap_baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZAP_BASELINE_ARTIFACT: zap-api-development-baseline
        run: bash scripts/zap/load-baseline.sh

      - name: Detect new ZAP findings
        id: new_zap_findings
        shell: bash
        env:
          BASELINE_FOUND: ${{ steps.zap_baseline.outputs.found }}
        run: bash scripts/zap/detect-new-findings.sh

      - name: Prepare ZAP notification details
        id: zap_notification
        if: steps.new_zap_findings.outputs.count != '0'
        shell: bash
        run: bash scripts/zap/prepare-notification.sh

      - name: Build ZAP finding baseline
        shell: bash
        run: bash scripts/zap/update-baseline.sh

      - name: Upload ZAP finding baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-api-development-baseline
          path: zap-findings-baseline.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload ZAP SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          sarif_file: report.github.sarif.json
          category: zap-api-development

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-api-development-reports
          path: |
            zap-reports/report_html.html
            zap-reports/report_json.json
            zap-reports/report_md.md
            zap-reports/report.sarif.json
            report.github.sarif.json
          if-no-files-found: warn
          retention-days: 14

      - name: Send ZAP notification
        if: steps.new_zap_findings.outputs.count != '0'
        uses: govuk-once/govuk-platform-notifications-gh-action/security-alerts@9790ae74363e58ed5600a4705a77af94b583435d
        with:
          aws_account_id: ${{ steps.aws-account.outputs.account-id }}
          aws_region: eu-west-2
          title: "New ZAP security findings"
          message: "New findings detected during the authenticated ZAP API scan."
          finding_count: ${{ steps.new_zap_findings.outputs.count }}
          findings: ${{ steps.zap_notification.outputs.findings }}
          repository: ${{ github.repository }}
          workflow_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          slack_channel: "#govuk-once-flex-alerting-dev"

  workflow_fail:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "❌ Continuous Deployment workflow failed"
