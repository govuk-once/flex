name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qualityChecks:
    name: Quality Checks
    uses: ./.github/workflows/_quality-checks.yml
    permissions:
      id-token: write
      contents: read
      actions: read # required by nrwl/nx-set-shas to find the last successful workflow run on main
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "development"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      SONAR_TOKEN_FLEX: ${{ secrets.SONAR_TOKEN_FLEX }}
      SONAR_URL: ${{ secrets.SONAR_URL }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  release:
    name: Create Release
    needs: qualityChecks
    uses: govuk-once/platform-shared-ci-cd/.github/workflows/semantic-release.yml@v1.1.6
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    secrets:
      deployment-role: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  deployDev:
    name: Deploy to Development
    needs: [qualityChecks, release]
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "development"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  moduleE2EDev:
    name: Module E2E (Development)
    needs: deployDev
    uses: ./.github/workflows/_moduleE2E.yml
    permissions:
      id-token: write
      contents: read
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "development"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  deployStaging:
    name: Deploy to Staging
    needs: deployDev
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "staging"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  moduleE2EStaging:
    name: Module E2E (Staging)
    needs: deployStaging
    uses: ./.github/workflows/_moduleE2E.yml
    permissions:
      id-token: write
      contents: read
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "staging"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  zapSecurityScan:
    name: ZAP Security Scan (Staging)
    needs: deployStaging
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    uses: ./.github/workflows/zap.yml
    secrets: inherit # pragma: allowlist secret

  deployProd:
    name: Deploy to Production
    needs: [deployStaging, zapSecurityScan]
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: "production"
    secrets:
      ROLE_TO_ASSUME: ${{ secrets.PROD_DEPLOYMENT_ROLE }}

  send-release-notification:
    name: Notify Production Release Slack channel
    needs: [release, deployProd]
    if: needs.release.outputs.released == 'true'
    uses: govuk-once/platform-shared-ci-cd/.github/workflows/release-notification.yml@v1.1.6
    permissions:
      contents: read
      id-token: write
    with:
      application: "FLEX"
      version: ${{ needs.release.outputs.version }}
      type: ${{ needs.release.outputs.type }}
      slack-channel: ${{ vars.SLACK_RELEASE_CHANNEL }}
    secrets:
      deployment-role: ${{ secrets.PROD_DEPLOYMENT_ROLE }}
